[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/runtime-agent",
    "apps/desktop/src-tauri",
    "services/api",
    "services/gateway",
    "services/runtime",
    "services/scheduler",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/qianliang-lq/openstaff"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
openstaff-protocol = { path = "crates/protocol" }
